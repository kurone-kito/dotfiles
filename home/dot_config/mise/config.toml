[tools]
dotnet = "latest"
node = "latest"
pnpm = "latest"

# dandavison/delta stopped shipping x86_64-apple-darwin builds at
# v0.19.0 (aarch64-apple-darwin is still published). Pin macOS to the
# last version with an Intel build; other platforms track latest.
# Revisit dropping this pin around 2028-12, once Intel Mac support is
# expected to be broadly moot (~3 years past the macOS Tahoe cycle).
delta = [
  { version = "0.18.2", os = "macos" },
  { version = "latest", os = ["linux", "windows"] },
]
fastfetch = "latest"
fzf = "latest"
grok = "latest"
jq = "latest"
# ggml-org/llama.cpp is in the mise registry as the llama.cpp shorthand
# (github:ggml-org/llama.cpp, version_prefix = "b"). The key is quoted
# because an unquoted llama.cpp is a TOML dotted key (tools.llama.cpp)
# and mise rejects that table. GitHub flags every current bNNNN release
# as prerelease; the non-prerelease "latest" (v0.3.0) ships only
# nightly-tag.txt, no binaries. prerelease = true makes 2026.8.14 track
# rolling bNNNN the same way the mise 2026.9.0+ registry already does.
#
# Unresolved-point-1 (asset variant): each OS publishes CPU plus
# Vulkan/CUDA/ROCm/SYCL/OpenVINO archives (macOS is CPU-only). A
# throwaway Linux install of latest selected
# llama-b<ver>-bin-ubuntu-x64.tar.gz (generic CPU), not vulkan/cuda.
# Leave matching/asset_pattern unset so one entry stays portable.
# winget's ggml.llamacpp pins Vulkan x64, which has no macOS asset and
# would break this three-OS config. Windows CPU-vs-vulkan is the same
# generic-vs-named-variant scoring, not verified on Windows hardware.
#
# Unresolved-point-2 (shims): the archive has no bin/ subdirectory;
# binaries sit at the extract root. llama-cli and llama-server are
# present there, the registry bins list already names both, and
# `mise which` resolves them without filter_bins/bin_path. Extra
# llama-* tools also shim. Linux .so files are executable so they
# appear in bin-names; not filtering them avoids hiding llama-bench
# and llama-quantize.
#
# Linux, macOS, and Windows GitHub assets exist and mise resolved the
# Linux CPU archive, so os is not restricted (unlike pstop).
"llama.cpp" = { version = "latest", prerelease = true }
mkcert = "latest"
tealdeer = "latest"
terraform = "latest"
# tsl0922/ttyd's aqua-registry entry declares
# supported_envs: [linux, windows/amd64] with no darwin entry, so
# macOS is not a supported target for this backend. vhs (which needs
# ttyd + ffmpeg on PATH at runtime) still works on macOS through its
# own aqua:charmbracelet/vhs entry; ttyd itself must come from another
# route there (e.g. Homebrew).
ttyd = { version = "latest", os = ["linux", "windows"] }
vhs = "latest"
yq = "latest"
yt-dlp = "latest"

"aqua:anomalyco/opencode" = "latest"
"aqua:google-antigravity/antigravity-cli" = "latest"
"aqua:supabase/cli" = "latest"

# mise's npm backend now defaults to its embedded aube installer
# (npm.package_manager = "auto"), which never shells out to the npm
# CLI, so an npm-CLI-only npm_args flag (e.g. --ignore-scripts=false)
# is silently dropped. aube is default-deny for dependency lifecycle
# scripts, so @anthropic-ai/claude-code's postinstall never ran, and
# that postinstall is what hardlinks the platform-native binary over
# the placeholder bin/claude.exe shipped in the wrapper tarball
# (without it, that placeholder is just a shell script and `claude`
# cannot start). allow_builds is the backend-independent tool option
# aube (and modern npm/pnpm) honors instead; scope it to this one
# package rather than allow_builds = true so no transitive dependency
# gets an unreviewed build-script opt-in.
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@bitwarden/cli" = "latest"
"npm:@executeautomation/playwright-mcp-server" = "latest"
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@microsoft/inshellisense" = "latest"
"npm:@openai/codex" = "latest"

# mise's embedded aube installer rejects the "latest"-resolved 0.1.19
# release under its trustPolicy=no-downgrade check: every version from
# 0.1.0 through 0.1.18 was published by microsoft/playwright-cli's
# GitHub Actions workflow via npm's OIDC trusted-publisher (carrying
# Sigstore/SLSA provenance), but 0.1.19 was instead published from
# Microsoft's internal ESRP pipeline (microsoft/playwright-cli#456),
# which attaches no such trust evidence, so `mise install` fails hard.
# Pin to 0.1.18, the last OIDC-trusted release, until a newer version
# restores trust evidence -- GitHub Actions + OIDC publishing was
# already restored upstream in microsoft/playwright-cli#459, so this
# pin should be revisited once that lands in a published release.
"npm:@playwright/cli" = "0.1.18"
"npm:bash-language-server" = "latest"
"npm:fast-cli" = "latest"

"github:x-motemen/ghq" = "latest"
"github:d-kuro/gwq" = "latest"
"github:cli/cli" = "latest"
"github:anatawa12/git-vrc" = "latest"

# mise's ubi backend is deprecated (scheduled for removal in mise
# 2027.1.0), so this uses the github backend instead. Upstream was
# transferred from marlocarlo/pstop to psmux/pstop (GitHub redirects the
# old name; `mise ls-remote` returns the same latest version for both).
# pstop's only release archive is pstop-windows-x86_64.zip (plus a
# .sha256 checksum file; Windows-only upstream), so os restricts install
# attempts to Windows. The archive also ships htop.exe next to pstop.exe
# (mirrors WinGet's marlocarlo.pstop two-link behavior) directly at the
# archive root, with no bin/ subdirectory; the github backend's default
# bin lookup falls back to the extraction root and shims every
# executable found there when no bin/ dir exists, so both binaries are
# expected to shim without bin_path/extract_all (a ubi-only option with
# no github-backend equivalent). Not yet confirmed on real Windows
# hardware — if the default lookup misses a binary, add filter_bins or
# bin_path explicitly.
"github:psmux/pstop" = { version = "latest", os = ["windows"] }

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
not_found_auto_install = false
trusted_config_paths = [
  '~/ghq/github.com/kurone-kito',
]
