# Reconciled against idd-template v0.14.0 (2026-10-05): preserve its
# base dictionaries, cache, ignore path, and vocabulary alongside the
# repository-specific dictionaries, ignores, and words. #238's
# full-repository `npx cspell lint "**"` sweep (broader than the
# incremental-only scan `cspell-action@v8` runs in CI by default)
# separately found pre-existing false positives outside the IDD surface
# across home/, tests/, and .vscode/; those local terms remain below.
allowCompoundWords: true
cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
dictionaries:
  - cpp-compound-words
  - cpp
  - dotnet
  - en_US
  - en-gb
  - fullstack
  - git
  - markdown
  - misc
  - node
  - redis
  - shellscript
  - softwareTerms
  - vim
enableGlobDot: true
features:
  weighted-suggestions: true
globRoot: ${cwd}
ignorePaths:
  - .*ignore
  - .git
  - .github/CODE_OF_CONDUCT.*
  - .vscode/extensions.json
  - pnpm-lock.yaml
  - home/dot_config/git/ignore
  - tests/bash/helpers
ignoreRegExpList:
  - 'github:[a-zA-Z0-9_-]+/'
  - kuroné?
language: en,ja
useGitignore: true
version: '0.2'
words:
  - ajeetdsouza
  - AKIAEXAMPLE
  - anomalyco
  - aquaproj
  - bbwe
  - bufnr
