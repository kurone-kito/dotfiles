# Reconciled against the idd-template v0.6.0 dictionary (2026-08-13,
# issue #236); no additional words were genuinely IDD-relevant beyond
# what this list already covers.
allowCompoundWords: true
dictionaries:
  - cpp-compound-words
  - dotnet
  - en_US
  - en-gb
  - fullstack
  - git
  - markdown
  - misc
  - node
  - redis
  - shellscript
  - softwareTerms
  - vim
enableGlobDot: true
features:
  weighted-suggestions: true
globRoot: ${cwd}
ignorePaths:
  - .*ignore
  - .git
  - .github/CODE_OF_CONDUCT.*
  - .vscode/extensions.json
  - home/dot_config/git/ignore
  - tests/bash/helpers
ignoreRegExpList:
  - 'github:[a-zA-Z0-9_-]+/'
  - kuroné?
language: en,ja
useGitignore: true
version: '0.2'
words:
  - AKIAEXAMPLE
  - anomalyco
  - curlrc
  - dedup
  - deprioritize
  - desync
  - desynced
  - dorny
  - Esync
  - exrc
  - Fira
  - gdefault
  - gpgconf
  - hlsearch
  - HKLM
  - inputrc
  - inshellisense
  - junegunn
  - keepassxc
  - kito
  - luac
  - luks
  - mergo
  - MINIMIZABLE
  - MYVIMRC
  - nnoremap
  - nvmrc
  - onlogon
  - ONNX
  - psmux
  - pylint
  - qwen
  - rerere
  - rollup
  - sheerun
  - taskrc
  - TOCTOU
  - tpope
  - undispositioned
  - unioned
  - unpushed
  - unreplied
  - unscored
  - unwaived
  - upserts
  - waivable
  - wgetrc
  - viml
  - vimrc
  - virtiofs
  - WORKFPR
  - xclip
  - zcompdump
  - zdharma
  - zdiff3
