# Reconciled against the idd-template v0.6.0 dictionary (2026-08-13,
# issue #236); no additional words were genuinely IDD-relevant beyond
# what this list already covers. #238's full-repository `npx cspell
# lint "**"` sweep (broader than the incremental-only scan
# `cspell-action@v8` runs in CI by default) separately found 23
# pre-existing false positives outside the IDD surface -- proper
# nouns, real flags/identifiers, and escape-sequence tokenizer
# artifacts across home/, tests/, and .vscode/ -- and added them here.
allowCompoundWords: true
dictionaries:
  - cpp-compound-words
  - dotnet
  - en_US
  - en-gb
  - fullstack
  - git
  - markdown
  - misc
  - node
  - redis
  - shellscript
  - softwareTerms
  - vim
enableGlobDot: true
features:
  weighted-suggestions: true
globRoot: ${cwd}
ignorePaths:
  - .*ignore
  - .git
  - .github/CODE_OF_CONDUCT.*
  - .vscode/extensions.json
  - home/dot_config/git/ignore
  - tests/bash/helpers
ignoreRegExpList:
  - 'github:[a-zA-Z0-9_-]+/'
  - kuroné?
language: en,ja
useGitignore: true
version: '0.2'
words:
  - ajeetdsouza
  - AKIAEXAMPLE
  - anomalyco
  - bbwe
  - bufnr
