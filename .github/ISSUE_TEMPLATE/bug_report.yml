name: 🐛 Bug report
description: Create a report to help us improve
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you continue filling out this report, please take a moment to check that your bug has not been [already reported on GitHub](https://github.com/kurone-kito/dotfiles/search?q=is%3Aissue&type=issues) 🙌

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Which operating system did you see this on?
      options:
        - Linux (native)
        - macOS
        - Windows (native, PowerShell)
        - WSL2 (Windows Subsystem for Linux)
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      description: Which shell did you see this in?
      options:
        - bash
        - zsh
        - PowerShell (pwsh, 7+)
        - PowerShell 5.1 (Windows built-in)
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Bug Overview
      description: A clear and concise overview of the bug.
      placeholder: When zsh starts, the starship prompt renders "Y" instead of "X".
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: I expect the starship prompt to render "Z" instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce the Bug
      description: Detail the series of steps required to reproduce the bug.
      placeholder: After a fresh `chezmoi apply`, opening a new zsh session shows "Y" in the terminal outputs and/or logs.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Please provide details about your environment.
      value: |
        - `chezmoi --version` output:
        - Reproduces on a fresh `chezmoi apply`, or only on an already-customized machine?
        - Relevant mise-managed tool and version (if applicable), e.g. `mise ls <tool>`:
    validations:
      required: true

  - type: textarea
    id: affected_area
    attributes:
      label: Affected file(s) or area
      description: 'Optional. Which config file, shell, or mise-managed tool does this concern? A rough hint is enough — exact file paths are not required.'
      placeholder: |
        e.g. one of: Shell environments, Shell plugins & prompt,
        Development tools, Git, Editors & terminal, Network tools,
        Security, Containers, Productivity, Task management, CLI tools,
        AI coding assistants, or IDD workflow / .github/instructions

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Feel free to add any other context/information/screenshots/etc... that you think might be relevant to this issue in here.
