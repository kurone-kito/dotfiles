name: Ruleset required-checks guard
# Periodically re-verifies that the `master` branch ruleset still
# enforces a `required_status_checks` rule with the expected context
# set. Added after a 2026-08-02 incident where that rule silently
# disappeared in its entirety and went undetected for 11 days -- see
# the "Required status checks on `master`" section of
# docs/idd-policy.md for the incident writeup. The expected-context
# list now lives in scripts/check-ruleset-drift.sh (its
# `default_expected_contexts` function) rather than here -- update that
# script and the doc section together whenever a required context is
# added or removed.
#
# On drift (or when the ruleset's required_status_checks rule
# disappears entirely), this workflow escalates beyond its own red X:
# it opens (or comments on, avoiding duplicate-issue spam across
# repeated daily failures) a tracking issue with a fixed, greppable
# title, and closes that issue with an explanatory comment the next
# time the check passes while it is still open. See
# scripts/escalate-ruleset-drift.sh and
# docs/idd-policy.md's "Scheduled drift guard (#249)" section.
#
# Uses the "Get rules for a branch" effective-rules endpoint
# (`repos/{owner}/{repo}/rules/branches/{branch}`) -- a lighter-weight
# read than the `/rulesets` summary/detail endpoints
# `.github/instructions/idd-ci.instructions.md`'s required-check
# discovery unions with classic branch protection: this endpoint does
# not require the elevated `administration` permission those need, so
# the default `GITHUB_TOKEN` with `contents: read` (plus `issues: write`
# for the escalation/recovery steps below) is sufficient. This guard
# intentionally checks only the ruleset side of that union (classic
# branch protection is unconfigured on this repository today, per
# docs/idd-policy.md's `trustEmptyProtectionReads` note); revisit this
# workflow if branch protection is ever configured on `master` alongside
# the ruleset.
on:
  schedule:
    # Off the start of the hour and away from midnight UTC: GitHub's
    # own docs warn that schedules clustered at popular times (:00 in
    # particular) can be delayed or dropped during high load.
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  # cancel-in-progress: false (queue, never cancel) is required here,
  # not merely a stricter option than true: the find-or-create sequence
  # in "Find open tracking issue" / "Escalate on failure" is not atomic,
  # so cancelling an in-flight run after it decided no tracking issue is
  # open but before it finishes creating one would let the next queued
  # run repeat that same stale decision and create a duplicate --
  # reintroducing the exact race the ref-independent group below closes
  # for the concurrent case. Queueing instead of cancelling means a
  # later run only ever starts after the earlier one's create/comment
  # step has actually finished, so its own find-tracking-issue search
  # sees that result.
  cancel-in-progress: false
  # Deliberately NOT keyed by `${{ github.ref }}`: the checked resource
  # (the `master` ruleset) and the tracking issue this workflow
  # escalates to are both global, not per-ref, but `workflow_dispatch`
  # can be triggered from any branch. A ref-keyed group would let a
  # scheduled run on `master` and a manual dispatch from another branch
  # run concurrently, race on "does a tracking issue already exist?",
  # and both take the create path -- defeating the de-duplication this
  # workflow depends on. Serializing across every ref (combined with
  # cancel-in-progress: false above) closes that race for both the
  # concurrent-run and the cancelled-mid-create case.
  group: ${{ github.workflow }}
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRACKING_ISSUE_TITLE: 'ci: master ruleset required_status_checks drift detected'
    steps:
      - name: Check out repository
        # SHA-pinned, not the mutable @v7 tag idd-advisory-convergence.yml
        # (read-only permissions) safely uses: this job holds
        # `issues: write`, the same risk tier as post-merge-cleanup.yml's
        # own write-capable checkout, which pins the same SHA below for
        # the same reason -- a retargeted mutable tag could otherwise
        # execute arbitrary action code with this job's write-capable
        # token.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Trusted default-branch checkout, not whatever ref triggered
          # the run, for any trigger type including workflow_dispatch --
          # mirrors idd-advisory-convergence.yml's rationale: this job
          # runs scripts/*.sh with an `issues: write` token, so it must
          # never execute a branch's own copy of those scripts.
          # persist-credentials: false additionally keeps that token out
          # of .git/config -- neither script here performs a git
          # operation; both call `gh` directly via the GH_TOKEN env var,
          # so nothing needs the credential helper.
          # <!-- dotfiles-divergence: master-branch -->
          ref: master
          persist-credentials: false

      - name: Fetch ruleset rules
        id: fetch
        # continue-on-error, same as Check drift below: a `gh api`
        # hiccup here must not silently skip the escalation path via
        # the implicit success() GitHub Actions adds to a step's
        # default (absent) `if:` -- see the "escalate/fail on any
        # checked step" comment below for the actual load-bearing
        # mechanism (explicit always() + direct outcome checks); this
        # keeps all three checked steps' own status reporting uniform.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --paginate --slurp + flatten: the endpoint defaults to 30
          # rules per page, and this repository's ruleset already
          # returns 6 -- comfortably below that today, but an
          # unpaginated call would silently drop later pages once
          # more rules accumulate.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/rules/branches/master" \
            | jq 'flatten' > rules.json

      - name: Check drift
        id: check
        # Only run when Fetch ruleset rules actually succeeded: without
        # this, a rules.json-fetch failure would still let this step
        # attempt to read a missing/stale rules.json, failing for an
        # unrelated ("no such file") reason that would be misreported
        # as a drift-check failure. Skipping cleanly here keeps failure
        # attribution unambiguous for the Escalate/Fail steps below,
        # which read steps.fetch.outcome and steps.check.outcome
        # separately.
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          # GitHub Actions' default bash `run:` shell already runs with
          # `-e` (errexit) active before this script body executes. This
          # script never enabled it itself, but `set +e` still disables
          # it -- errexit is a shell option, not a lexically-scoped
          # setting, so any `set +e` in the running shell turns it off
          # regardless of who turned it on. That's exactly why the line
          # below is required, not decorative: without it, errexit would
          # abort the step the moment the piped command below returns
          # non-zero, pre-empting the explicit `exit "${PIPESTATUS[0]}"`
          # line that's meant to own this step's exit code.
          set +e
          bash scripts/check-ruleset-drift.sh rules.json | tee check-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Find open tracking issue
        id: find-issue
        if: always()
        # continue-on-error for the same reason as Fetch ruleset rules
        # above: keeps this checked step's own status reporting
        # uniform with the other two. The actual escalation/job-failure
        # mechanism below does not depend on it (it already uses
        # explicit always() + direct outcome checks).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUMBER=$(bash scripts/escalate-ruleset-drift.sh find-tracking-issue \
            --title "$TRACKING_ISSUE_TITLE" --repo "$GITHUB_REPOSITORY")
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Escalate on failure
        # Explicit always() + direct per-step outcome checks, not a
        # bare `if:` relying on the implicit success() GitHub Actions
        # adds to it -- this is what actually reaches this step for
        # ANY of the three checked steps' failures (Fetch ruleset
        # rules, Check drift, Find open tracking issue), not only a
        # real drift finding. See #317 for the incident this closes:
        # an infra failure in either of the first two steps used to
        # leave a red X with no escalation at all.
        if: >-
          always() &&
          (steps.fetch.outcome == 'failure' ||
           steps.check.outcome == 'failure' ||
           steps.find-issue.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE_NUMBER: ${{ steps.find-issue.outputs.number }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FIND_ISSUE_OUTCOME: ${{ steps.find-issue.outcome }}
        run: |
          set -euo pipefail
          # check-output.txt only exists when Check drift actually ran
          # (it is skipped when Fetch ruleset rules failed) -- guard the
          # read and default both vars to empty so referencing them
          # below never trips this step's own `set -u`.
          MISSING=""
          EXTRA=""
          if [ -f check-output.txt ]; then
            MISSING=$(sed -n 's/^MISSING_CONTEXTS=//p' check-output.txt)
            EXTRA=$(sed -n 's/^EXTRA_CONTEXTS=//p' check-output.txt)
          fi
          # Distinguish an infra failure (this workflow's own steps
          # misbehaving) from a genuine drift finding, so the tracking
          # issue names the actual failure instead of an empty diff.
          # Left empty when neither of these two steps failed, i.e. a
          # drift-only escalation -- unchanged from before this issue.
          REASON=""
          if [ "$FETCH_OUTCOME" = "failure" ]; then
            REASON="Fetch ruleset rules step failed"
          fi
          if [ "$FIND_ISSUE_OUTCOME" = "failure" ]; then
            if [ -n "$REASON" ]; then
              REASON="${REASON}; Find open tracking issue step failed"
            else
              REASON="Find open tracking issue step failed"
            fi
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # NOTE: when Find open tracking issue itself failed,
          # TRACKING_ISSUE_NUMBER is unknown/empty, so this may create a
          # new tracking issue even if one is already open for a real
          # drift -- a possible duplicate in that rare combined-failure
          # case. Accepted trade-off: still escalating the infra
          # failure is more valuable than silently skipping it, and
          # de-duplication would need find-issue to have succeeded in
          # the first place.
          bash scripts/escalate-ruleset-drift.sh escalate \
            --title "$TRACKING_ISSUE_TITLE" \
            --issue "$TRACKING_ISSUE_NUMBER" \
            --missing "$MISSING" \
            --extra "$EXTRA" \
            --reason "$REASON" \
            --run-url "$RUN_URL" \
            --repo "$GITHUB_REPOSITORY"

      - name: Recover on success
        # Unchanged by #317: steps.check.outcome can only be 'success'
        # when Fetch ruleset rules also succeeded (Check drift's new
        # `if:` above gates on that), so this condition still only
        # fires on a genuinely clean run. Note this will also close an
        # open tracking issue that was opened for a prior *infra*
        # failure, with this same "ruleset matches again" wording --
        # behaviorally correct (the check does pass now) even though
        # the original escalation may not have been a drift finding.
        if: steps.check.outcome == 'success' && steps.find-issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE_NUMBER: ${{ steps.find-issue.outputs.number }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bash scripts/escalate-ruleset-drift.sh recover \
            --issue "$TRACKING_ISSUE_NUMBER" \
            --run-url "$RUN_URL" \
            --repo "$GITHUB_REPOSITORY"

      - name: Fail the job on any check failure
        # Renamed from "Fail the job on drift": broadened, same as
        # Escalate on failure above, so the job still surfaces a red X
        # for every failure class this workflow can hit (a Fetch
        # ruleset rules or Find open tracking issue infra failure, not
        # only a genuine drift finding) -- continue-on-error on those
        # two steps above would otherwise silently remove their
        # automatic job-failing behavior.
        if: >-
          always() &&
          (steps.fetch.outcome == 'failure' ||
           steps.check.outcome == 'failure' ||
           steps.find-issue.outcome == 'failure')
        run: exit 1
