# Trust model: this workflow triggers on `pull_request_target`, which runs
# with base-repository permissions and secrets even for pull requests from
# forks. That is safe here only because all of the following hold, and any
# future edit to this file must preserve them:
#   - No unreviewed PR-head content is ever checked out: the sole
#     `actions/checkout` step below carries no `ref:` override. For the
#     `pull_request_target` trigger this resolves to the base branch's
#     tip at event time -- because the job only proceeds when
#     `merged == true`, that tip already includes this PR's own merge
#     (this repository merges via merge commits, so it is typically that
#     merge commit itself) -- it is never the PR's own head SHA, and
#     never content that has not already passed through the merge
#     decision. For `workflow_dispatch`, checkout instead resolves to
#     whatever ref the dispatch targeted (the default branch, when
#     dispatched from the Actions UI on that branch) -- this is not
#     governed by the `pull_request_target` ref rule, but the checked-out
#     code is never executed either way (see the next point), so this
#     difference does not widen the trust boundary.
#   - No PR-head code, workflow, or action is ever executed: the only
#     script that runs is the pinned `ephemeral-npx` `idd-audit-pr-cleanup`
#     CLI (see docs/idd-policy.md "Helper Runtime Profile"), invoked with
#     the PR number passed through `env:` as inert numeric data, never
#     interpolated into the script body.
#   - The `cleanup` job only runs when
#     `github.event.pull_request.merged == true`; for `workflow_dispatch`
#     (human-triggered, but not otherwise constrained by GitHub) the job
#     additionally re-verifies via `gh pr view` that the given PR number
#     is actually merged before invoking `--apply`, and refuses to run
#     otherwise.
#   - `permissions:` stays least-privilege: `contents: read`,
#     `issues: write`, `pull-requests: write` -- no `contents: write` and
#     no elevated or secret-bearing scopes.
# If a future change adds a `ref:` override on the checkout step, downloads
# or executes PR-head content, widens `permissions:`, or removes the
# merged-only guard (including the workflow_dispatch re-verification),
# re-review this trust model before merging that change.
#
# Adapted from kurone-kito/idd-skill's
# .github/workflows/post-merge-cleanup.yml at pin
# f51a8bb73a47452eff5799e8a27251b660ba4ae0 (v0.7.0; reconciled from the
# prior v0.6.0 pin by #296). This
# repository runs the ephemeral-npx helper profile (no vendored
# scripts/ directory), so this invokes the packaged idd-audit-pr-cleanup
# CLI rather than upstream's `node scripts/audit-pr-cleanup.mjs` form --
# a pinned tarball URL rather than upstream's generic multi-profile
# resolution (which falls back to a mutable default archive URL under
# ephemeral-npx when `helperRuntime.packageSpec` is unset), so this copy
# is not exposed to that wider fetch-at-run-time surface. `runs-on`
# (`ubuntu-latest`) matches upstream's own default for this specific
# file directly -- upstream's `idd-template` copy of
# `post-merge-cleanup.yml` has never shipped `ubuntu-slim` (unlike
# `idd-advisory-convergence.yml`, whose upstream template copy is
# `ubuntu-slim`); this repository's real divergence for this file is
# reusing the ephemeral-npx packaged `idd-audit-pr-cleanup` CLI directly
# (a single pinned-tarball invocation) instead of upstream's
# profile-resolving `node scripts/audit-pr-cleanup.mjs` /
# multi-package-manager branching. The checkout/setup-node action pins
# are copied verbatim from upstream's own pinned-SHA choices, since this
# workflow's elevated `pull_request_target` permissions warrant the same
# supply-chain hardening upstream already applied. The duplicate
# evidence-comment check below is trust-scoped to match upstream's
# v0.7.0 hardening (#296, following the v0.6.0-round #237 precedent):
# skip posting only when the **latest** trusted
# `idd-cleanup-evidence` comment already recorded `applied` or `clean`
# -- a stale `failed`/`incomplete`/`rescan-failed`/`permission-blocked`
# record no longer suppresses a fresh retry's evidence post, and an
# untrusted commenter's marker-prefixed comment must never suppress the
# genuine evidence post either way.
name: Post-merge cleanup
on:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to clean up
        required: true
        type: number
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: post-merge-cleanup-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core on
    # Windows, which would silently misinterpret this file's POSIX
    # command substitution and shell variable expansion instead of
    # failing loudly. No-op on this repository's ubuntu-latest runner;
    # imported for parity with upstream.
    shell: bash
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Run F4 cleanup (server-side fallback)
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # workflow_dispatch is human-triggered but not otherwise
            # constrained by GitHub to a merged PR, unlike the
            # pull_request_target trigger's `if:` guard above. Re-verify
            # directly rather than trusting the dispatch input.
            MERGED=$(gh pr view "$PR_NUMBER" --json merged --jq '.merged' 2>/dev/null || echo "")
            if [ "$MERGED" != "true" ]; then
              echo "::error::PR #$PR_NUMBER is not merged; refusing to run cleanup for a manual dispatch against an unmerged PR"
              exit 1
            fi
          fi
          set +e
          JSON=$(npx --yes --package https://codeload.github.com/kurone-kito/idd-skill/tar.gz/f51a8bb73a47452eff5799e8a27251b660ba4ae0 \
            idd-audit-pr-cleanup \
            --pr "$PR_NUMBER" \
            --apply \
            --skip-claim-check \
            --format json 2>cleanup-stderr.log)
          HELPER_EXIT=$?
          set -e
          # Prefer the helper's JSON report when it is parseable, even on
          # non-zero exit (the helper writes the report then exits 1 when
          # failed.length > 0, so the report is still authoritative).
          PARSED_STATUS=""
          if [ -n "$JSON" ]; then
            PARSED_STATUS=$(printf '%s' "$JSON" | jq -r '.status // ""' 2>/dev/null || echo "")
          fi
          if [ -n "$PARSED_STATUS" ]; then
            printf '%s\n' "$JSON" > cleanup-report.json
            STATUS="$PARSED_STATUS"
            APPLIED=$(printf '%s' "$JSON" | jq -r '(.applied // []) | length')
            FAILED=$(printf '%s' "$JSON" | jq -r '(.failed // []) | length')
            SKIPPED=$(printf '%s' "$JSON" | jq -r '(.skipped // []) | length')
            BLOCKED=$(printf '%s' "$JSON" | jq -r '[(.skipped // [])[] | select(.isMinimized==false and .viewerCanMinimize==false)] | length')
            RETRY_ATTEMPTS=$(printf '%s' "$JSON" | jq -r '.retryAttempts // 0')
            RETRY_BOUND_EXHAUSTED=$(printf '%s' "$JSON" | jq -r '.retryBoundExhausted // false')
            if [ "$HELPER_EXIT" -ne 0 ]; then
              echo "::warning::idd-audit-pr-cleanup exited $HELPER_EXIT but emitted a valid JSON report; using helper status \"$STATUS\""
            fi
          else
            echo "::warning::idd-audit-pr-cleanup exited $HELPER_EXIT with no parseable JSON; posting helper-error evidence"
            STATUS="helper-error"
            APPLIED=0
            FAILED=0
            SKIPPED=0
            BLOCKED=0
            RETRY_ATTEMPTS=0
            RETRY_BOUND_EXHAUSTED=false
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "status=$STATUS"
            echo "applied=$APPLIED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "blocked=$BLOCKED"
            echo "retry_attempts=$RETRY_ATTEMPTS"
            echo "retry_bound_exhausted=$RETRY_BOUND_EXHAUSTED"
          } >> "$GITHUB_OUTPUT"
      - name: Post cleanup evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cleanup.outputs.pr_number }}
          STATUS: ${{ steps.cleanup.outputs.status }}
          APPLIED: ${{ steps.cleanup.outputs.applied }}
          FAILED: ${{ steps.cleanup.outputs.failed }}
          SKIPPED: ${{ steps.cleanup.outputs.skipped }}
          BLOCKED: ${{ steps.cleanup.outputs.blocked }}
          RETRY_ATTEMPTS: ${{ steps.cleanup.outputs.retry_attempts }}
          RETRY_BOUND_EXHAUSTED: ${{ steps.cleanup.outputs.retry_bound_exhausted }}
        run: |
          # Avoid duplicate evidence comments, but only on a genuinely
          # converged outcome. Workflow-level concurrency only serialises
          # this workflow's own runs; an agent F4 (or a maintainer
          # rerunning workflow_dispatch on the same PR) can still have
          # posted an evidence comment outside this run. Skip only when
          # the latest trusted <!-- idd-cleanup-evidence: {status} ... -->
          # comment already records `applied` or `clean` -- a trusted
          # comment recording any other status (`failed`, `incomplete`,
          # `rescan-failed`, `permission-blocked`) invites a retry, so a
          # rerun must post fresh evidence for its own outcome instead of
          # leaving stale non-success evidence as the PR's only record.
          # "Trusted" scoping: this workflow's own posts are authored by
          # `github-actions[bot]` (the GITHUB_TOKEN actor), and an agent's
          # local F4 post is authored by a configured `trustedMarkerActors`
          # login. An untrusted commenter pre-posting this marker prefix
          # must never suppress the genuine evidence post or be treated as
          # a completed cleanup record (this is the same trust-scoping
          # every other IDD operational marker already applies).
          # `|| true` keeps a missing/unreadable config.json a soft "no
          # extra trusted logins" read instead of aborting this step under
          # the default `bash -eo pipefail`.
          TRUSTED_LOGINS=$(
            {
              jq -r '(.trustedMarkerActors // [])[]' .github/idd/config.json 2>/dev/null || true
              echo 'github-actions[bot]'
            } | tr '[:upper:]' '[:lower:]'
          )
          # Capture into a variable (not process substitution): a failure
          # inside `< <(gh api ...)` does not reliably propagate to this
          # shell's default `-e`/`pipefail`, which could leave EXISTING
          # empty and post a duplicate evidence comment on a transient
          # `gh api` failure (rate limit/network). A plain command
          # substitution assignment does trip `-e` on failure.
          #
          # The API returns issue comments in creation-ascending order, so
          # iterating every match without an early `break` and keeping the
          # last assignment leaves EXISTING/EXISTING_STATUS holding the
          # *latest* trusted comment, not merely the first one found.
          COMMENTS_TSV=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- idd-cleanup-evidence:")) | [.id, .user.login, (.body | split("\n")[0])] | @tsv')
          EXISTING=""
          EXISTING_STATUS=""
          while IFS=$'\t' read -r candidate_id candidate_login candidate_marker_line; do
            [ -z "$candidate_id" ] && continue
            lower_login=$(printf '%s' "$candidate_login" | tr '[:upper:]' '[:lower:]')
            if printf '%s\n' "$TRUSTED_LOGINS" | grep -Fxq "$lower_login"; then
              EXISTING="$candidate_id"
              EXISTING_STATUS=$(printf '%s' "$candidate_marker_line" \
                | sed -n 's/^<!-- idd-cleanup-evidence: \([^ ]*\) .*/\1/p')
            fi
          done <<< "$COMMENTS_TSV"
          if [ -n "$EXISTING" ] && { [ "$EXISTING_STATUS" = "applied" ] || [ "$EXISTING_STATUS" = "clean" ]; }; then
            echo "::notice::PR #${PR_NUMBER} already has a trusted-author idd-cleanup-evidence comment recording '${EXISTING_STATUS}' (id: ${EXISTING}); skipping workflow post."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "<!-- idd-cleanup-evidence: ${STATUS} applied:${APPLIED} failed:${FAILED} skipped:${SKIPPED} viewer-cannot-minimize:${BLOCKED} retry-attempts:${RETRY_ATTEMPTS} retry-bound-exhausted:${RETRY_BOUND_EXHAUSTED} -->" \
            "**F4 Cleanup Evidence** (server-side fallback via \`post-merge-cleanup.yml\`)" \
            "| Field              | Value |" \
            "| ------------------ | ----- |" \
            "| Status             | ${STATUS} |" \
            "| Applied            | ${APPLIED} |" \
            "| Failed             | ${FAILED} |" \
            "| Skipped            | ${SKIPPED} |" \
            "| Permission-blocked | ${BLOCKED} |" \
            "| Retry attempts (bound-exhausted) | ${RETRY_ATTEMPTS} (${RETRY_BOUND_EXHAUSTED}) |" \
            "| Posted by          | post-merge-cleanup workflow |" \
          )
          printf '%s' "$BODY" | gh pr comment "$PR_NUMBER" --body-file -
