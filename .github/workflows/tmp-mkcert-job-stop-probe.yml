name: TEMP mkcert job-stop probe
# TEMPORARY workflow for issue #615 evidence collection only. It records
# whether a child process survives Stop-Job on Windows PowerShell 5.1
# (powershell.exe) and pwsh 7 (pwsh.exe). This workflow is deleted by the
# same pull request that records the result in docs/mkcert-local-ca.md.
on:
  push:
    branches:
      - issue/615-ci-mkcert-record-job-stop-behaviour-on
permissions:
  contents: read
jobs:
  probe-windows-powershell-5-1:
    name: Probe Stop-Job on Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Run job-stop probe under powershell.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch { }

          $edition = $PSVersionTable.PSEdition
          $psver = $PSVersionTable.PSVersion.ToString()
          $hostPath = (Get-Process -Id $PID).Path
          Write-Output "RESULT edition=$edition psversion=$psver host_exe=$hostPath host_pid=$PID"

          $dir = Join-Path $env:RUNNER_TEMP ('probe-' + $edition)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $mkcert = Join-Path $dir 'mkcert.exe'
          $url = 'https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-windows-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile $mkcert -UseBasicParsing
          $mkver = (& $mkcert -version 2>&1 | Out-String).Trim()
          Write-Output "RESULT mkcert_url=$url mkcert_version=$mkver"

          $caroot = Join-Path $dir 'caroot'
          New-Item -ItemType Directory -Force -Path $caroot | Out-Null
          $env:CAROOT = $caroot
          $env:TRUST_STORES = 'system'
          Write-Output "RESULT throwaway_caroot=$caroot trust_stores=$($env:TRUST_STORES)"

          function Get-Survivors([int]$hostPid, [string]$procName) {
            $byName = @(Get-Process -Name $procName -ErrorAction SilentlyContinue | ForEach-Object { [string]$_.Id })
            $byParent = @(Get-CimInstance -ClassName Win32_Process -Filter "ParentProcessId = $hostPid" -ErrorAction SilentlyContinue | ForEach-Object { '{0}:{1}' -f $_.ProcessId, $_.Name })
            $hostAlive = [bool](Get-Process -Id $hostPid -ErrorAction SilentlyContinue)
            return [pscustomobject]@{ ByName = $byName; ByParent = $byParent; HostAlive = $hostAlive }
          }

          function Format-List([string[]]$items) {
            if ($items.Count -eq 0) { return 'none' }
            return ($items -join ',')
          }

          function Stop-Recorded([object[]]$snapshots) {
            # Cleanup only by recorded PID: collect the PIDs we enumerated, then Stop-Process -Id.
            $pids = @()
            foreach ($s in $snapshots) {
              $pids += @($s.ByName)
              $pids += @($s.ByParent | ForEach-Object { ($_ -split ':')[0] })
            }
            foreach ($p in ($pids | Select-Object -Unique)) {
              Stop-Process -Id ([int]$p) -Force -ErrorAction SilentlyContinue
              Write-Output "RESULT cleanup_stopped_pid=$p"
            }
          }

          # Case A: the closest real case. mkcert -install inside Start-Job, bounded by Wait-Job, then Stop-Job.
          $pidFileA = Join-Path $dir 'mkcert.hostpid'
          $jobA = Start-Job -ScriptBlock {
            param($exe, $pidPath)
            Set-Content -Path $pidPath -Value $PID
            & $exe -install 2>&1
            "EXITCODE=$LASTEXITCODE"
          } -ArgumentList $mkcert, $pidFileA
          $startA = Get-Date
          $doneA = Wait-Job -Job $jobA -Timeout 60
          $elapsedA = [int]((Get-Date) - $startA).TotalSeconds
          $hostA = [int](Get-Content -Path $pidFileA -TotalCount 1)
          Write-Output "RESULT case=mkcert-install job_host_pid=$hostA bound_seconds=60"
          if ($doneA) {
            $outA = Receive-Job -Job $jobA -Keep
            Write-Output "RESULT case=mkcert-install outcome=completed-before-bound elapsed_seconds=$elapsedA job_state=$($jobA.State)"
            $outA | ForEach-Object { Write-Output ("OUT mkcert: " + $_) }
            Remove-Job -Job $jobA -Force
            $snapsA = @()
          } else {
            $stateBefore = $jobA.State
            Stop-Job -Job $jobA
            $stateAfterStop = $jobA.State
            Start-Sleep -Seconds 3
            $snap1 = Get-Survivors $hostA 'mkcert'
            $outA = Receive-Job -Job $jobA -Keep
            $outA | ForEach-Object { Write-Output ("OUT mkcert: " + $_) }
            Remove-Job -Job $jobA -Force
            Start-Sleep -Seconds 5
            $snap2 = Get-Survivors $hostA 'mkcert'
            Write-Output "RESULT case=mkcert-install outcome=stopped-at-bound elapsed_seconds=$elapsedA job_state_before_stop=$stateBefore job_state_after_stop=$stateAfterStop"
            Write-Output "RESULT case=mkcert-install survivors_3s_after_stop_by_name=$(Format-List $snap1.ByName) survivors_3s_after_stop_by_ppid=$(Format-List $snap1.ByParent) job_host_alive_3s=$($snap1.HostAlive)"
            Write-Output "RESULT case=mkcert-install survivors_8s_after_remove_by_name=$(Format-List $snap2.ByName) survivors_8s_after_remove_by_ppid=$(Format-List $snap2.ByParent) job_host_alive_8s=$($snap2.HostAlive)"
            $snapsA = @($snap1, $snap2)
          }

          # Case B: native sleeper control. ping.exe is a native process that sleeps about 300 s.
          $pidFileB = Join-Path $dir 'ping.hostpid'
          $jobB = Start-Job -ScriptBlock {
            param($pidPath)
            Set-Content -Path $pidPath -Value $PID
            & ping.exe -n 300 127.0.0.1 2>&1
          } -ArgumentList $pidFileB
          $doneB = Wait-Job -Job $jobB -Timeout 15
          $hostB = [int](Get-Content -Path $pidFileB -TotalCount 1)
          Write-Output "RESULT case=native-sleep job_host_pid=$hostB bound_seconds=15"
          if ($doneB) {
            Write-Output "RESULT case=native-sleep outcome=completed-before-bound job_state=$($jobB.State)"
            Remove-Job -Job $jobB -Force
            $snapsB = @()
          } else {
            $stateBeforeB = $jobB.State
            Stop-Job -Job $jobB
            $stateAfterStopB = $jobB.State
            Start-Sleep -Seconds 3
            $snapB1 = Get-Survivors $hostB 'PING'
            Remove-Job -Job $jobB -Force
            Start-Sleep -Seconds 5
            $snapB2 = Get-Survivors $hostB 'PING'
            Write-Output "RESULT case=native-sleep outcome=stopped-at-bound job_state_before_stop=$stateBeforeB job_state_after_stop=$stateAfterStopB"
            Write-Output "RESULT case=native-sleep survivors_3s_after_stop_by_name=$(Format-List $snapB1.ByName) survivors_3s_after_stop_by_ppid=$(Format-List $snapB1.ByParent) job_host_alive_3s=$($snapB1.HostAlive)"
            Write-Output "RESULT case=native-sleep survivors_8s_after_remove_by_name=$(Format-List $snapB2.ByName) survivors_8s_after_remove_by_ppid=$(Format-List $snapB2.ByParent) job_host_alive_8s=$($snapB2.HostAlive)"
            $snapsB = @($snapB1, $snapB2)
          }

          Stop-Recorded @($snapsA + $snapsB)
          Write-Output "RESULT edition=$edition done"
          exit 0
  probe-pwsh-7:
    name: Probe Stop-Job on pwsh 7
    needs: probe-windows-powershell-5-1
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Run job-stop probe under pwsh.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch { }

          $edition = $PSVersionTable.PSEdition
          $psver = $PSVersionTable.PSVersion.ToString()
          $hostPath = (Get-Process -Id $PID).Path
          Write-Output "RESULT edition=$edition psversion=$psver host_exe=$hostPath host_pid=$PID"

          $dir = Join-Path $env:RUNNER_TEMP ('probe-' + $edition)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $mkcert = Join-Path $dir 'mkcert.exe'
          $url = 'https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-windows-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile $mkcert -UseBasicParsing
          $mkver = (& $mkcert -version 2>&1 | Out-String).Trim()
          Write-Output "RESULT mkcert_url=$url mkcert_version=$mkver"

          $caroot = Join-Path $dir 'caroot'
          New-Item -ItemType Directory -Force -Path $caroot | Out-Null
          $env:CAROOT = $caroot
          $env:TRUST_STORES = 'system'
          Write-Output "RESULT throwaway_caroot=$caroot trust_stores=$($env:TRUST_STORES)"

          function Get-Survivors([int]$hostPid, [string]$procName) {
            $byName = @(Get-Process -Name $procName -ErrorAction SilentlyContinue | ForEach-Object { [string]$_.Id })
            $byParent = @(Get-CimInstance -ClassName Win32_Process -Filter "ParentProcessId = $hostPid" -ErrorAction SilentlyContinue | ForEach-Object { '{0}:{1}' -f $_.ProcessId, $_.Name })
            $hostAlive = [bool](Get-Process -Id $hostPid -ErrorAction SilentlyContinue)
            return [pscustomobject]@{ ByName = $byName; ByParent = $byParent; HostAlive = $hostAlive }
          }

          function Format-List([string[]]$items) {
            if ($items.Count -eq 0) { return 'none' }
            return ($items -join ',')
          }

          function Stop-Recorded([object[]]$snapshots) {
            # Cleanup only by recorded PID: collect the PIDs we enumerated, then Stop-Process -Id.
            $pids = @()
            foreach ($s in $snapshots) {
              $pids += @($s.ByName)
              $pids += @($s.ByParent | ForEach-Object { ($_ -split ':')[0] })
            }
            foreach ($p in ($pids | Select-Object -Unique)) {
              Stop-Process -Id ([int]$p) -Force -ErrorAction SilentlyContinue
              Write-Output "RESULT cleanup_stopped_pid=$p"
            }
          }

          # Case A: the closest real case. mkcert -install inside Start-Job, bounded by Wait-Job, then Stop-Job.
          $pidFileA = Join-Path $dir 'mkcert.hostpid'
          $jobA = Start-Job -ScriptBlock {
            param($exe, $pidPath)
            Set-Content -Path $pidPath -Value $PID
            & $exe -install 2>&1
            "EXITCODE=$LASTEXITCODE"
          } -ArgumentList $mkcert, $pidFileA
          $startA = Get-Date
          $doneA = Wait-Job -Job $jobA -Timeout 60
          $elapsedA = [int]((Get-Date) - $startA).TotalSeconds
          $hostA = [int](Get-Content -Path $pidFileA -TotalCount 1)
          Write-Output "RESULT case=mkcert-install job_host_pid=$hostA bound_seconds=60"
          if ($doneA) {
            $outA = Receive-Job -Job $jobA -Keep
            Write-Output "RESULT case=mkcert-install outcome=completed-before-bound elapsed_seconds=$elapsedA job_state=$($jobA.State)"
            $outA | ForEach-Object { Write-Output ("OUT mkcert: " + $_) }
            Remove-Job -Job $jobA -Force
            $snapsA = @()
          } else {
            $stateBefore = $jobA.State
            Stop-Job -Job $jobA
            $stateAfterStop = $jobA.State
            Start-Sleep -Seconds 3
            $snap1 = Get-Survivors $hostA 'mkcert'
            $outA = Receive-Job -Job $jobA -Keep
            $outA | ForEach-Object { Write-Output ("OUT mkcert: " + $_) }
            Remove-Job -Job $jobA -Force
            Start-Sleep -Seconds 5
            $snap2 = Get-Survivors $hostA 'mkcert'
            Write-Output "RESULT case=mkcert-install outcome=stopped-at-bound elapsed_seconds=$elapsedA job_state_before_stop=$stateBefore job_state_after_stop=$stateAfterStop"
            Write-Output "RESULT case=mkcert-install survivors_3s_after_stop_by_name=$(Format-List $snap1.ByName) survivors_3s_after_stop_by_ppid=$(Format-List $snap1.ByParent) job_host_alive_3s=$($snap1.HostAlive)"
            Write-Output "RESULT case=mkcert-install survivors_8s_after_remove_by_name=$(Format-List $snap2.ByName) survivors_8s_after_remove_by_ppid=$(Format-List $snap2.ByParent) job_host_alive_8s=$($snap2.HostAlive)"
            $snapsA = @($snap1, $snap2)
          }

          # Case B: native sleeper control. ping.exe is a native process that sleeps about 300 s.
          $pidFileB = Join-Path $dir 'ping.hostpid'
          $jobB = Start-Job -ScriptBlock {
            param($pidPath)
            Set-Content -Path $pidPath -Value $PID
            & ping.exe -n 300 127.0.0.1 2>&1
          } -ArgumentList $pidFileB
          $doneB = Wait-Job -Job $jobB -Timeout 15
          $hostB = [int](Get-Content -Path $pidFileB -TotalCount 1)
          Write-Output "RESULT case=native-sleep job_host_pid=$hostB bound_seconds=15"
          if ($doneB) {
            Write-Output "RESULT case=native-sleep outcome=completed-before-bound job_state=$($jobB.State)"
