name: IDD advisory-convergence comment refresh
# Non-required companion to idd-advisory-convergence.yml (upstream
# #2136, #2411). Human review-thread and regular-comment chatter must
# not create or cancel the required `idd-advisory-convergence`
# check-run, so this workflow has a different name, job id, and
# concurrency group -- it cannot overwrite that SHA verdict or cancel
# an in-flight required run.
#
# Compared against both of kurone-kito/idd-skill's copies of this file
# at pin 11105d705820e50be0a14fcc174587abbaf62b30 (v0.12.0; #459 bumped
# from the prior v0.11.0 pin set by #424. The file is unchanged versus
# upstream v0.12.0, so this bump is the invocation pin only; #384's
# adoption round remains the source of the simplified ephemeral-npx
# shape): its own root
# `.github/workflows/idd-advisory-convergence-comment.yml` (the simpler
# dogfooded original -- a single, non-branching `node scripts/*.mjs`
# call per step, no profile-resolution scaffolding) and the
# `idd-template/` copy of the same path (an adopter-facing wrapper
# around that same original, adding generic
# `helperRuntime.profile`-driven branching across
# `vendored-node`/`package-manager`/`ephemeral-npx`/`instructions-only`
# adopters). The two copies are identical for every part of this file
# that is not that branching (triggers, concurrency, permissions, and
# each step's underlying invocation). #384 adopted this workflow taking
# the root copy's simpler shape (matching how the sibling
# `post-merge-cleanup.yml` is itself adapted from root, not
# `idd-template/`) and substituting each `node scripts/*.mjs` call with
# the matching packaged ephemeral-npx CLI at a pinned tarball URL,
# exactly like both sibling files already do -- this repository does
# not need `idd-template/`'s generic helper-runtime-profile resolution
# or package-manager-detection scaffolding, having already committed to
# one helper profile (see docs/idd-policy.md "Helper Runtime Profile").
# #424 keeps that same simplified shape while merging in v0.11.0's
# structural changes below. #459 keeps that shape and only rebases the
# packaged CLI pin onto v0.12.0.
#
# When the comment is IDD-originated (reply-identity stamp,
# disposition prefix, or an operational marker the required check
# already honors), it reuses `idd-rerun-advisory-convergence --apply`
# to refresh the existing pull_request-family required run for the
# current HEAD SHA. It never asserts `ready` itself.
#
# Three trigger families land here: `pull_request_review_comment`
# (inline review-thread comments) and `issue_comment` (regular PR
# comments -- where post-idd-marker and disposition-non-review-notices
# actually post every marker/disposition type, since both use the
# issues-comments API), both pre-existing; and `pull_request_review`
# (review submissions, #424) -- moved here from
# idd-advisory-convergence.yml's own trigger list (see that file's
# header for the CI-check-identity-spoofing rationale). NOT for
# tamper-resistance: this workflow is just as PR-editable as the
# required workflow's own former trigger was (there is no
# `pull_request_review_target` -- GitHub's `_target` variant exists only
# for `pull_request`), so a same-repository PR can still disable or
# alter this step. What actually stays trusted is the push-triggered
# gate itself, via `pull_request_target` on `idd-advisory-convergence.yml`;
# this review-refresh path is deliberately best-effort on top of that,
# not a second trusted surface -- a tampered copy can only delay a fresh
# green, never force one, since the gate's own verdict is still computed
# independently on every push. Unlike the two comment families, a review
# submission is not filtered by IDD-originated content (see "Classify
# review comment" below), and "Rerun required HEAD check" below adds
# `--refresh-latest` for this one trigger family: the ordinary `--apply`
# alone only reruns a `rerun-eligible` instance (excludes anything
# already `pass` and enforces the rerun-once budget), which would leave a
# same-HEAD review landing after the gate already went green -- or after
# its one rerun was already spent -- unable to force a fresh evaluation.
# `--refresh-latest` reruns every resolvable pull_request-family instance
# for this HEAD unconditionally instead (still honoring
# ciWait.rerunPolicy), since the required rollup can stay pinned to an
# earlier instance even after a later one for the same SHA completes
# (kurone-kito/idd-skill#1381). This step still cannot reach
# `pull_request_review` submitted BY the primary bot itself: GitHub
# gates any workflow run a bot actor triggers to `action_required`
# regardless of which workflow it lands on, so the job never reaches
# this step for that submission -- unchanged from the former direct
# trigger, which was equally gated for the same actor. That gap
# self-heals on the next non-bot trigger (a push, or a human/session
# review-thread reply), exactly as it always has.
#
# Fork-originated PRs: a `pull_request_review` run whose PR is from a
# fork gets a read-only `GITHUB_TOKEN` from GitHub regardless of this
# workflow's declared `actions: write` permission -- the same
# restriction `pull_request_review_comment` (this workflow's own
# pre-existing trigger) already shares. The former `pull_request_review`
# trigger (directly on the required workflow) never hit this, because
# recomputing its own verdict needed only read access; routing through
# `gh run rerun` here needs write, which a fork PR's token cannot have --
# the mutation step fails visibly (a 403), not silently. Recovery is the
# same as any other stuck rollup: a maintainer's manual `gh run rerun`,
# the next push, or a configured external-check waiver.
#
# `issue_comment` also fires for a comment on a plain issue, not only a
# PR; the job-level `if:` below skips those
# (`github.event.issue.pull_request` is only present when the
# commented-on issue is a PR).
#
# `pull_request_review` deliberately skips the debounce step entirely:
# the two comment families need it because a burst of them all ask the
# same question (plain `--apply`), so skipping in favor of a later one
# is safe -- but a review's `--refresh-latest` is a stronger question a
# superseding comment-triggered run cannot answer on its behalf
# (comment-triggered runs never carry `--refresh-latest`). A review
# superseded by debounce would silently downgrade to whatever the later
# comment run does, which could leave an already-green gate green even
# though the review added new blocking findings. Debounce exists purely
# to protect the rerun-once budget from a comment burst (#2643) -- a
# hazard `--refresh-latest` does not share (it bypasses that budget
# already) and reviews do not produce (human-paced, not bursty) -- so
# this workflow does not need debounce protection for reviews at all;
# "Rerun required HEAD check" below always proceeds for a review
# submission instead of consulting the debounce step's output. Residual
# gap not closed by any of the above: a *queued*, not-yet-started run
# can still be evicted and replaced by a newer trigger sharing this same
# `concurrency.group` before debounce (which only judges an
# already-started run) ever gets a say -- this applies to a
# review-triggered run exactly as it does to a comment-triggered one.
# This is not new to reviews -- it is the same already-accepted gap the
# pre-existing comment-burst case already lived with. No safe mechanical
# fix exists within this file's scope; recovery is the same manual
# `idd-rerun-advisory-convergence --refresh-latest --apply` already
# documented above for the `action_required` and fork-PR-token cases.
#
# Job id is deliberately NOT `idd-advisory-convergence`.
#
# Runner: reads the `CI_RUNNER_LABEL` repository variable, falling back
# to `ubuntu-latest` when unset -- this workflow has no
# `workflow_dispatch` trigger of its own, so there is no `runner` input
# to check first. This no longer matches the required
# idd-advisory-convergence.yml companion's own `ubuntu-slim` fallback
# (or the `idd-template/` copy's hardcoded `ubuntu-slim`, with no
# override at all, at v0.9.0): #424 changed this job's own fallback to
# `ubuntu-latest` specifically, since `ubuntu-slim` is a single-CPU
# runner with a hard 15-minute job timeout that this job's own
# `timeout-minutes: 55` cannot be honored under there -- see the job's own
# comment below for the full rationale (Copilot review, PR #429).
# Likewise, the `PR_NUMBER` empty-guard in the "Rerun required HEAD check" step below
# matches `idd-template/`'s v0.9.0 content; this copy additionally
# applies the same guard to "Check for newer qualifying event", which
# neither upstream copy does -- a small, repository-added hardening
# consistent with how the sibling `idd-advisory-convergence.yml` /
# `post-merge-cleanup.yml` files already guard every `PR_NUMBER` use.
#
# Debounce (upstream #1381, #2023, #2638): a burst of IDD-originated
# comments fired `idd-rerun-advisory-convergence --apply` once per
# comment, exhausting every same-HEAD instance's one-time rerun budget
# mid-burst. The "Check for newer qualifying event" step below waits a
# short quiet window, then re-queries whether a newer IDD-originated
# comment/review has since landed on the same PR; if so, this run
# skips its own `--apply` call and leaves it to the later-triggered
# run (which asks the same question in turn). This is a job-body-level
# check -- it does not alter `cancel-in-progress: false` below, which
# stays exactly as upstream established it. (Note on that setting's
# actual scope: it protects only the currently in-progress run in this
# group from cancellation; a merely *pending*, not-yet-started run is
# still cancelled and replaced by the newest pending run when another
# is queued behind it, since no `queue:` key is set here -- the
# debounce below exists for the case where a run has already started
# and must itself decide whether a newer event supersedes it, which
# that pending-run replacement does not cover.) If the debounce step's
# own live-data collection fails, the step fails and GitHub Actions'
# default sequential-failure behavior skips "Rerun required HEAD
# check" entirely for that run -- safe, since this is a non-required
# companion refresh, and a later qualifying event (or the required
# check's own polling) will trigger a fresh attempt.
concurrency:
  # Do not cancel: a later human LGTM must not abort an in-flight
  # IDD-originated refresh before it reruns the required check.
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core
    # on Windows, which would silently misinterpret this file's POSIX
    # shell syntax instead of failing loudly. No-op on this job's own
    # ubuntu-latest default (#424) as on the sibling files' ubuntu-slim
    # one below -- bash is already the default shell on any Ubuntu-based
    # GitHub-hosted runner, regardless of variant; imported for parity
    # with the sibling idd-advisory-convergence.yml / post-merge-cleanup.yml
    # files, both still ubuntu-slim by default.
    shell: bash
jobs:
  refresh-if-idd-originated:
    # ubuntu-slim (this repository's usual default, and this job's own
    # default before #424) is a single-CPU GitHub-hosted runner with a
    # hard, non-overridable 15-minute job timeout regardless of the
    # `timeout-minutes:` declared below -- see
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners.
    # At the prior `timeout-minutes: 10` that was a non-issue (10 < 15),
    # but #424's bump to 55 (for the new --refresh-latest wait budget
    # below) cannot actually be honored on ubuntu-slim: GitHub would
    # silently kill this job at 15 minutes regardless, defeating the
    # very reliability fix --refresh-latest exists to provide (Copilot
    # review, PR #429). `ubuntu-latest` is a standard multi-CPU runner
    # without that cap; `CI_RUNNER_LABEL` still overrides both.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # 55, not the required gate's own 10: a pull_request_review
    # submission can land while the required gate's own run is still
    # mid-flight, and `--refresh-latest --apply` then blocks inside
    # rerun-advisory-convergence's own internal 15-minute safety bound
    # per wait -- not the gate's shorter 10-minute job timeout that
    # internal bound deliberately exceeds as its own margin. GitHub
    # kills THIS job outright at ITS OWN timeout regardless of what step
    # is running, so a bound smaller than the sum of the internal waits
    # it wraps would silently drop a deferred rerun before those
    # internal waits ever gave up gracefully -- exactly the scenario
    # `--refresh-latest` exists to prevent. 55 = 15 (waiting out the
    # original run, if still pending) + 2x15 (a typical case of two
    # sequential reruns, each bounded by the same 15-minute internal
    # safety margin -- not a hard upper bound; more concurrent family
    # instances for one HEAD would need more, since
    # idd-rerun-advisory-convergence reruns every resolvable
    # pull_request-family instance for this HEAD, not a fixed count,
    # kurone-kito/idd-skill#1381) + 10 headroom for setup/checkout and
    # the steps preceding this wait.
    timeout-minutes: 55
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted default-branch checkout, not the PR head -- same
          # rationale as idd-advisory-convergence.yml's own checkout
          # step: the classification/debounce/rerun logic and its
          # config (.github/idd/config.json) must be the trusted copy,
          # not the PR's own. Pinned to a commit SHA rather than this
          # repository's usual floating `@v7` tag (see
          # idd-advisory-convergence.yml) because this workflow, unlike
          # that read-only required check, carries `actions: write` --
          # a genuinely more privileged, supply-chain-sensitive
          # permission -- so it gets the same pinned-SHA hardening
          # post-merge-cleanup.yml already applies for its own elevated
          # permissions, matching upstream's own root dogfooded copy's
          # pin choice.
          # <!-- dotfiles-divergence: master-branch -->
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # Both upstream copies replace this step with an inline "Assert
      # Node.js floor" `node -e` check instead (their runner's
      # preinstalled Node is already known-good, so they only assert
      # the version rather than provisioning one). This repository
      # instead provisions the exact `.nvmrc`-pinned version via
      # `setup-node`, matching the sibling `idd-advisory-convergence.yml`
      # / `post-merge-cleanup.yml` files' own convention (this file also
      # needs `npx` itself, which the plain assertion does not provide).
      #
      # This repository runs the ephemeral-npx helper profile (no
      # vendored scripts/ directory), so invoke the packaged CLIs
      # rather than upstream's `node scripts/*.mjs` forms. See
      # docs/idd-policy.md "Helper Runtime Profile".
      - name: Classify review comment
        id: origin
        env:
          # A pull_request_review event carries its free-text summary at
          # github.event.review.body, not github.event.comment.body (no
          # `comment` object exists for that event). Feeding it through
          # the same classifier costs nothing -- a review body can itself
          # carry an IDD marker -- but a review submission always
          # qualifies for a rerun regardless of this classifier's
          # verdict; see the `if:` conditions below, which OR in
          # `pull_request_review` explicitly rather than relying on
          # content classification.
          COMMENT_BODY: ${{ github.event.review.body || github.event.comment.body }}
        run: |
          npx --yes --package https://codeload.github.com/kurone-kito/idd-skill/tar.gz/11105d705820e50be0a14fcc174587abbaf62b30 \
            idd-review-comment-origin
      - name: Check for newer qualifying event
        id: debounce
        # pull_request_review deliberately excluded -- see the Debounce
        # module-header paragraph above for why a review must not be
        # debounced in favor of a later comment-triggered run. This
        # conjunct is load-bearing, not redundant: a review body that
        # happens to classify as IDD-originated (it is fed through the
        # same classifier as a comment, for the reason documented on
        # "Classify review comment" above) would otherwise still satisfy
        # `idd_originated == 'true'` and run this step for a review --
        # and if this step's own live-data collection then failed, the
        # job would stop here (module header above), never reaching
        # "Rerun required HEAD check" at all for that review.
        if: steps.origin.outputs.idd_originated == 'true' && github.event_name != 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # Same PR-number resolution as the rerun step below, though
          # this step itself only ever runs for pull_request_review_comment
          # or issue_comment -- its own `if:` above excludes
          # pull_request_review entirely. pull_request_review_comment
          # carries github.event.pull_request.number; issue_comment
          # carries it at github.event.issue.number instead.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Both pull_request_review_comment and issue_comment carry
          # the triggering comment's own timestamps at
          # github.event.comment (matching COMMENT_BODY above). Prefer
          # updated_at: pull_request_review_comment also fires on
          # edited/deleted (see on: above), and created_at would then
          # still name the comment's original post time, not this edit
          # -- making every comment posted between the original post
          # and the edit look "newer than the trigger" and wrongly
          # skip this run. updated_at equals created_at for a
          # never-edited comment, so this is safe for the
          # created-event case too.
          TRIGGERED_AT: ${{ github.event.comment.updated_at || github.event.comment.created_at }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi
          npx --yes --package https://codeload.github.com/kurone-kito/idd-skill/tar.gz/11105d705820e50be0a14fcc174587abbaf62b30 \
            idd-advisory-comment-debounce --pr "$PR_NUMBER" --triggered-at "$TRIGGERED_AT"
      - name: Rerun required HEAD check
        # The explicit `success() &&` on the comment-family branch is
        # load-bearing, not redundant: GitHub Actions implicitly
        # prepends `success()` to a step's own `if:` UNLESS the
        # expression itself already calls one of
        # success()/failure()/always() -- so without an explicit call
        # here, a failure in "Classify review comment" above (its own
        # script throwing, e.g. on a malformed review body) would
        # implicitly skip this ENTIRE step, silently defeating the
        # review branch's own "always proceeds" guarantee for the exact
        # trigger that guarantee exists to protect. Calling success()
        # explicitly suppresses that implicit prepend and lets the
        # pull_request_review disjunct genuinely short-circuit
        # regardless of any earlier step's own outcome, while the
        # comment-family branch still requires it, matching this step's
        # pre-existing (implicit) behavior for that path unchanged.
        if: github.event_name == 'pull_request_review' || (success() && steps.origin.outputs.idd_originated == 'true' && steps.debounce.outputs.skip != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # pull_request_review and pull_request_review_comment carry
          # the PR number at github.event.pull_request.number;
          # issue_comment carries it at github.event.issue.number
          # instead.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # A review submission reruns unconditionally (module header
          # above) when this job itself runs, including when the gate is
          # already `pass` or its rerun-once budget is already spent --
          # neither of the two comment families needs that: they are
          # already filtered to IDD-originated content and share the
          # ordinary rerun-once budget deliberately (#2643 comment-burst
          # protection). "When this job itself runs" is doing real work
          # here: the primary bot's own review submission is gated to
          # `action_required` before any step executes (module header
          # above) -- unconditional refers to bypassing pass/budget
          # classification once this step runs, not to every review
          # submission reaching it. Single word, no spaces -- safe to
          # expand unquoted below (omitted entirely, not an empty-string
          # argument, when empty).
          REFRESH_FLAG: ${{ github.event_name == 'pull_request_review' && '--refresh-latest' || '' }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi
          # shellcheck disable=SC2086 # REFRESH_FLAG is a single trusted
          # word ("--refresh-latest" or empty); see env: above.
          npx --yes --package https://codeload.github.com/kurone-kito/idd-skill/tar.gz/11105d705820e50be0a14fcc174587abbaf62b30 \
            idd-rerun-advisory-convergence --pr "$PR_NUMBER" $REFRESH_FLAG --apply
