concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
name: Test workflow
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  detect-changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      requires_full_ci: ${{ steps.resolve.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      # Only meaningful for pull_request events, which paths-filter
      # resolves via the GitHub API (a reliable full PR-vs-base diff,
      # regardless of how many commits are in the PR). Deliberately
      # not attempted for push events: there is no single correct
      # "previous state" to diff against for an arbitrary branch name
      # (a self-referential base like the branch's own ref falls back
      # to a merge-base-with-master diff, which pulls in the entire
      # branch history instead of just this push's changes; a fresh
      # branch's first push also has no prior commit to diff at all).
      # Push events simply always require full CI below instead.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            requires_full_ci:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      - name: Resolve requires_full_ci
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ steps.filter.outputs.requires_full_ci }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

  bash-tests:
    name: Bash tests (bats)
    needs: detect-changes
    # always() overrides the default "skip if a need failed" behavior
    # so a failed/cancelled detect-changes fails open to running the
    # real job, rather than silently skipping it (which would satisfy
    # the required-status-check gate without ever having run).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.requires_full_ci == 'true')
    runs-on: ubuntu-latest
    # The job starts a real pueue daemon (see PUEUE_VERSION below), which can
    # hang in a way the fakes of the other cases cannot. A normal run takes
    # about four minutes; lint.yml uses the same bound.
    timeout-minutes: 15
    env:
      CHEZMOI_VERSION: v2.71.0
      # pueue is pinned on purpose: the fake pueue in
      # tests/bash/with-pueue.bats models exactly this version, so a newer
      # release that behaves differently has to fail the real-daemon case
      # instead of slipping in unnoticed. To bump it, change the version and
      # both digests together. The digests are in
      # `gh api repos/Nukesor/pueue/releases/tags/<tag>` (`.assets[].digest`);
      # confirm them by hashing the downloaded files before pinning them here.
      # They are for the x86_64-unknown-linux-musl release assets.
      PUEUE_VERSION: v4.0.4
      PUEUE_SHA256: c1b10d7e4e62211075ddd0e1dc3e8cbfc5a43d662cb3be7402a28504e23fcb51
      PUEUED_SHA256: 5afeff6adbafb909e8d54e2caff158e6966c2adffa2c09e60fd631cc51b60390
      # Fail, instead of skip, the real-daemon case of with-pueue.bats when
      # pueue or pueued is missing from PATH.
      REQUIRE_REAL_PUEUE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # The user-global activation helper tests run the v0.16.0 CLI, which
      # needs Node.js 22.23.2+, 24.2.0+, or 26+. Provision the repository pin
      # rather than trust the runner's ambient node (same step as the sibling
      # IDD workflows).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Cache chezmoi binary
        id: cache-chezmoi
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/chezmoi
          key: chezmoi-${{ runner.os }}-${{ runner.arch }}-${{ env.CHEZMOI_VERSION }}
      - name: Install chezmoi
        if: steps.cache-chezmoi.outputs.cache-hit != 'true'
        run: sh -c "$(curl --proto '=https' -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "$CHEZMOI_VERSION"
      - name: Ensure chezmoi on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # `sh -c "$(curl ...)"` exits 0 when the download fails (an empty
      # script succeeds), so confirm the binary exists, whether it came
      # from the cache or from the install above, instead of letting the
      # chezmoi-dependent tests self-skip silently.
      - name: Verify chezmoi
        run: chezmoi --version
      # The real-daemon case of with-pueue.bats needs pueue and pueued.
      # They go to the same directory as chezmoi, which is on PATH already.
      - name: Cache pueue binaries
        id: cache-pueue
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/pueue
            ~/.local/bin/pueued
          key: pueue-${{ runner.os }}-${{ runner.arch }}-${{ env.PUEUE_VERSION }}
      # Download into an empty directory and run nothing from it until both
      # digests match the values pinned above.
      - name: Install pueue
        if: steps.cache-pueue.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/Nukesor/pueue/releases/download/$PUEUE_VERSION"
          download_dir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "$download_dir/pueue" "$base/pueue-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "$download_dir/pueued" "$base/pueued-x86_64-unknown-linux-musl"
          printf '%s  %s\n' \
            "$PUEUE_SHA256" "$download_dir/pueue" \
            "$PUEUED_SHA256" "$download_dir/pueued" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$download_dir/pueue" "$download_dir/pueued" "$HOME/.local/bin/"
          rm -rf -- "$download_dir"
      # Runs on a cache hit too: the cache is not a trusted source, so the
      # installed files are checked against the pinned digests on every run
      # before anything executes them.
      - name: Verify pueue
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$PUEUE_SHA256" "$HOME/.local/bin/pueue" \
            "$PUEUED_SHA256" "$HOME/.local/bin/pueued" | sha256sum -c -
          pueue --version
          pueued --version
      - name: Install zsh if missing
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zsh
          fi
      - name: Run bats tests
        run: tests/bash/helpers/bats-core/bin/bats tests/bash/

  powershell-tests:
    name: PowerShell tests (Pester)
    needs: detect-changes
    # always() overrides the default "skip if a need failed" behavior
    # so a failed/cancelled detect-changes fails open to running the
    # real job, rather than silently skipping it (which would satisfy
    # the required-status-check gate without ever having run).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.requires_full_ci == 'true')
    runs-on: windows-latest
    env:
      CHEZMOI_VERSION: v2.71.0
    steps:
      - uses: actions/checkout@v7
      # Some tests (e.g. signing-resolve.Tests.ps1,
      # winget-user-path-packages-tmpl.Tests.ps1) render real chezmoi
      # templates via `chezmoi execute-template` and self-skip when
      # chezmoi is unavailable -- install it here (mirrors bash-tests'
      # pinned install) so those suites actually execute on Windows CI
      # instead of always reporting Skipped.
      - name: Cache chezmoi binary
        id: cache-chezmoi
        uses: actions/cache@v6
        with:
          path: ~/bin/chezmoi.exe
          key: chezmoi-${{ runner.os }}-${{ runner.arch }}-${{ env.CHEZMOI_VERSION }}
      - name: Install chezmoi
        if: steps.cache-chezmoi.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Invoke-RestMethod 'https://get.chezmoi.io/ps1'
          & ([scriptblock]::Create($installer)) -BinDir "$HOME\bin" -Tag $env:CHEZMOI_VERSION
      - name: Ensure chezmoi on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME 'bin')
      - name: Install Pester if needed
        shell: pwsh
        # Bounded to the Pester 6 line: Pester 6 removed Assert-MockCalled
        # outright (Should -Invoke is the only surviving assertion), so an
        # unbounded -MinimumVersion let a routine `Install-Module` silently
        # jump 5 -> 6 and break the whole Assert-MockCalled surface with no
        # warning. The upper bound keeps automatic pickup of 6.x patches
        # while forcing any future major bump (e.g. 7) through a deliberate,
        # reviewed change instead of repeating that failure.
        run: |
          if (-not (Get-Module -ListAvailable Pester |
              Where-Object {
                $_.Version -ge [version]'5.0' -and $_.Version -lt [version]'7.0'
              })) {
            Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 6.99.99 `
              -Force -SkipPublisherCheck
          }
      - name: Run Pester tests
        shell: pwsh
        # Explicitly import the bounded major line first: PSModulePath
        # module auto-loading prefers the highest available version, so an
        # unqualified `Invoke-Pester` could still silently run under a
        # 7.x module if one were ever present alongside the capped 6.x
        # install above -- defeating the -MaximumVersion bound on install.
        #
        # -CI sets Run.Exit = $true (and TestResult.Enabled = $true), so
        # a genuine test failure actually fails this step -- without it,
        # Invoke-Pester's own process exit code stays 0 even when tests
        # fail, letting the required "PowerShell tests (Pester)" check
        # report success on a real failure.
        run: |
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 6.99.99 -Force
          Invoke-Pester tests/powershell/ -Output Detailed -CI

  powershell51-tests:
    name: PowerShell 5.1 tests (Pester)
    needs: detect-changes
    # Advisory only: not registered in the ruleset's required-check set
    # yet, so a failure here does not block merges (#166). Promotion to
    # required is a later decision once this leg proves stable.
    # always() overrides the default "skip if a need failed" behavior
    # so a failed/cancelled detect-changes fails open to running the
    # real job, rather than silently skipping it (which would satisfy
    # the required-status-check gate without ever having run).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.requires_full_ci == 'true')
    runs-on: windows-latest
    env:
      CHEZMOI_VERSION: v2.71.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1 (major version 5), got $($PSVersionTable.PSVersion)"
          }
      # Some tests (e.g. signing-resolve.Tests.ps1,
      # winget-user-path-packages-tmpl.Tests.ps1) render real chezmoi
      # templates via `chezmoi execute-template` and self-skip when
      # chezmoi is unavailable -- install it here (mirrors bash-tests'
      # pinned install) so those suites actually execute on Windows CI
      # instead of always reporting Skipped.
      - name: Cache chezmoi binary
        id: cache-chezmoi
        uses: actions/cache@v6
        with:
          path: ~/bin/chezmoi.exe
          key: chezmoi-${{ runner.os }}-${{ runner.arch }}-${{ env.CHEZMOI_VERSION }}
      - name: Install chezmoi
        if: steps.cache-chezmoi.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          # PS5.1's .NET default protocol set can exclude TLS 1.2, which
          # get.chezmoi.io requires -- same fix as the PSGallery install
          # below.
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $installer = Invoke-RestMethod 'https://get.chezmoi.io/ps1'
          & ([scriptblock]::Create($installer)) -BinDir "$HOME\bin" -Tag $env:CHEZMOI_VERSION
      - name: Ensure chezmoi on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME 'bin')
      - name: Install Pester if needed
        shell: powershell
        # Bounded to the Pester 6 line: see the matching comment on the
        # PS7 job's "Install Pester if needed" step above for the
        # rationale (Pester 6 removed Assert-MockCalled outright).
        run: |
          if (-not (Get-Module -ListAvailable Pester |
              Where-Object {
                $_.Version -ge [version]'5.0' -and $_.Version -lt [version]'7.0'
              })) {
            # PS5.1's .NET default protocol set can exclude TLS 1.2, which
            # PSGallery requires. Add it without dropping whatever
            # protocols were already enabled (same pattern as
            # 55-setup-editors.ps1.tmpl's vim-plug bootstrap).
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 6.99.99 `
              -Force -SkipPublisherCheck -Scope CurrentUser
          }
      - name: Run Pester tests
        shell: powershell
        # Force-import Pester 5+ first: PSModulePath can list the inbox
        # Pester 3.4 module ahead of the CurrentUser-scoped install above,
        # and plain auto-loading would silently run the suite (or fail)
        # under the wrong major version. The upper bound mirrors the
        # capped install above -- module auto-loading prefers the highest
        # available version, so an unbounded import could still resolve
        # to a 7.x module if one were ever present, defeating the cap.
        #
        # -CI (see the matching comment on the PS7 job's "Run Pester
        # tests" step above) makes a genuine test failure actually fail
        # this step. This job is advisory only (not a required check),
        # but keeping both jobs' failure semantics identical avoids a
        # confusing asymmetry.
        run: |
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 6.99.99 -Force
          Invoke-Pester tests/powershell/ -Output Detailed -CI

  powershell-linux-tests:
    name: PowerShell tests (Pester, Linux)
    needs: detect-changes
    # Advisory only: not registered in the ruleset's required-check set
    # yet (#552), so a failure here does not block merges. It runs the
    # whole suite on Linux so the Unix-scoped tests (marked
    # `-Skip:($IsWindows -ne $false)`), which the two Windows jobs report
    # as skipped, have a CI owner. Promotion to required is a later
    # decision: it means editing `default_expected_contexts` in
    # scripts/check-ruleset-drift.sh together with
    # tests/bash/ruleset-drift-check.bats and its fixtures, the "Required
    # status checks on `master`" section of docs/idd-policy.md and the
    # ruleset itself.
    # always() overrides the default "skip if a need failed" behavior
    # so a failed/cancelled detect-changes fails open to running the
    # real job, rather than silently skipping it (a skipped job reports
    # success in the check rollup without ever having run).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.requires_full_ci == 'true')
    runs-on: ubuntu-latest
    env:
      CHEZMOI_VERSION: v2.71.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Some tests render real chezmoi templates via
      # `chezmoi execute-template` and self-skip when chezmoi is
      # unavailable -- install the pinned version here (same cache key
      # and install as bash-tests) so those suites actually execute.
      - name: Cache chezmoi binary
        id: cache-chezmoi
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/chezmoi
          key: chezmoi-${{ runner.os }}-${{ runner.arch }}-${{ env.CHEZMOI_VERSION }}
      - name: Install chezmoi
        if: steps.cache-chezmoi.outputs.cache-hit != 'true'
        run: sh -c "$(curl --proto '=https' -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "$CHEZMOI_VERSION"
      - name: Ensure chezmoi on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # `sh -c "$(curl ...)"` exits 0 when the download fails (an empty
      # script succeeds), so confirm the binary exists, whether it came
      # from the cache or from the install above, instead of letting the
      # chezmoi-dependent tests self-skip silently.
      - name: Verify chezmoi
        run: chezmoi --version
      - name: Install Pester if needed
        shell: pwsh
        # Same bound as the Windows jobs: see the matching comment on
        # powershell-tests' "Install Pester if needed" step.
        run: |
          if (-not (Get-Module -ListAvailable Pester |
              Where-Object {
                $_.Version -ge [version]'5.0' -and $_.Version -lt [version]'7.0'
              })) {
            Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 6.99.99 `
              -Force -SkipPublisherCheck
          }
      - name: Run Pester tests
        shell: pwsh
        # Same import and -CI semantics as powershell-tests: see the
        # matching comment on that job's "Run Pester tests" step.
        run: |
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 6.99.99 -Force
          Invoke-Pester tests/powershell/ -Output Detailed -CI

  lua-syntax:
    name: Lua syntax check
    needs: detect-changes
    # always() overrides the default "skip if a need failed" behavior
    # so a failed/cancelled detect-changes fails open to running the
    # real job, rather than silently skipping it (which would satisfy
    # the required-status-check gate without ever having run).
    if: |
      always() &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.requires_full_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1
      - name: Check Lua syntax
        shell: bash
        run: |
          if [ ! -d home/dot_config/nvim ]; then
            echo "::error::home/dot_config/nvim directory not found"
            exit 1
          fi

          errors=0
          checked=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            if ! luac -p "$f"; then
              errors=$((errors + 1))
            fi
          done < <(find home/dot_config/nvim -name '*.lua' -print0)

          echo "Checked $checked Lua file(s)"

          if [ "$checked" -eq 0 ]; then
            echo "::error::No Lua files found under home/dot_config/nvim"
            exit 1
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors Lua file(s) have syntax errors"
            exit 1
          fi

  advisory-wait-required-fields:
    name: Advisory-wait required fields (bats)
    # Deliberately not gated on the detect-changes job: this check reads
    # Markdown instruction files, so a Markdown-only pull request must
    # still run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # The job runs PR-controlled test code and needs no authenticated
          # Git commands after checkout, so do not leave the token behind.
          persist-credentials: false
      - name: Run advisory-wait required-field check
        run: tests/bash/helpers/bats-core/bin/bats tests/bash/advisory-wait-required-fields.bats
