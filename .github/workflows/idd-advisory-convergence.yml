name: IDD advisory-convergence gate
# Asserts Copilot advisory-review convergence on a PR, intended to be
# registered as a required status check on `master` (once this
# workflow is proven green -- see #149). Adapted from
# kurone-kito/idd-skill's
# idd-template/.github/workflows/idd-advisory-convergence.yml at pin
# f51a8bb73a47452eff5799e8a27251b660ba4ae0 (v0.7.0; reconciled from the
# prior v0.6.0 pin by #296, which also keeps this file's helper pin in
# sync with the rest of the repository's ephemeral-npx invocations --
# see docs/idd-policy.md "Helper Runtime Profile"). This round's
# reconciliation is the fix for the PR #291 false negative -- see
# roadmap #292's "Why this matters" for the root cause. The
# maintainer-authorized waiver escape is already configured in
# `.github/idd/config.json` `ciGate.*`; see docs/idd-policy.md "CI Gate
# External Check Waivers" for the waiver path.
#
# Runner override: `runs-on` below reads the `runner` workflow_dispatch
# / workflow_call input first, then the `CI_RUNNER_LABEL` repository
# variable, falling back to `ubuntu-latest` when both are unset (as
# they are today -- no such variable is configured, so ordinary
# pull_request-triggered behavior is unchanged). `workflow_dispatch`'s
# `runner` input carries its own default (`ubuntu-latest`), so a manual
# dispatch always resolves the input before `CI_RUNNER_LABEL` is ever
# consulted -- inert today since no other default is configured, and
# matches upstream's own equivalent precedence. This only imports the
# override mechanism upstream added in v0.6.0/v0.7.0; adopting a
# non-default runner is a separate, deliberate decision this
# reconciliation does not make. Preserving this repository's own
# `ubuntu-latest` default rather than adopting upstream's `ubuntu-slim`
# flip at v0.7.0 is itself a deliberate decision, not an oversight --
# see docs/idd-policy.md "Post-Merge Cleanup Automation" and the sibling
# `post-merge-cleanup.yml` header for the same repository-wide runner
# convention.
#
# CI topology: convergence can change WITHOUT a new push -- when
# Copilot submits its review (pull_request_review) -- so that trigger is
# added alongside pull_request. As of the v0.7.0 reconciliation,
# upstream moved review-thread-comment-triggered refresh
# (pull_request_review_comment) exclusively to the new, non-required
# `idd-advisory-convergence-comment.yml` companion workflow; this
# repository defers adopting that companion this round (see PR body for
# the concrete packaged-CLI gap that motivated deferral), so a
# disposition reply alone no longer auto-refreshes this required check
# -- fall back to the manual `gh run rerun`/`workflow_dispatch` recovery
# path below (or the `idd-rerun-advisory-convergence` helper bin) when
# that happens. Several pull_request/pull_request_review events can
# still fire in quick succession during review triage, so `concurrency:`
# below debounces them to at most one active run per pull request
# instead of several stacked ones -- this exact multi-run pattern is a
# documented, previously-investigated upstream incident:
# kurone-kito/idd-skill#1381 (empirically reproduced on that
# repository's own PR #1383; see that repository's identically-pinned
# idd-advisory-convergence.yml header for the full writeup) -- ported
# here after #226 hit the same friction without it.
#
# `cancel-in-progress: true` does not fully close the gap: a stale
# CANCELLED run can still race a later SUCCESS run for the identical
# head SHA in the required-check rollup display. When that happens,
# recover with `gh run rerun <run-id>` on the run(s) for the current
# head SHA -- find them via `gh run list
# --workflow=idd-advisory-convergence.yml --limit 50 --json
# databaseId,headSha,conclusion` filtered to that exact SHA (raise
# `--limit` past its default of 20 on a busy PR). If more than one run
# matches and it is unclear which one the rollup is stuck on, rerun all
# of them rather than guessing -- rerunning an already-successful run
# is safe (it just re-confirms the same result; it still consumes
# runner time, so it is not literally a no-op). Use the plain
# whole-run `gh run rerun <run-id>` form, not `--failed`: a stale
# CANCELLED run has no job with a `failure` conclusion for `--failed`
# to retry, so it would silently do nothing. `workflow_dispatch` does
# not reliably flip the rollup for its own head SHA either (it has no
# `pull_request` context of its own), so prefer rerunning an existing
# pull_request-family-triggered run over dispatching a fresh one
# whenever one already exists for the current head SHA.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
      runner:
        description: Runner label (default ubuntu-latest)
        required: false
        type: string
        default: ubuntu-latest
  workflow_call:
    inputs:
      runner:
        default: ubuntu-latest
        required: false
        type: string
      pr_number:
        description: PR number when this workflow is called without a pull_request event
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core on
    # Windows, which would silently misinterpret this file's POSIX
    # shell syntax instead of failing loudly. No-op on this repository's
    # own ubuntu-latest default; imported for parity with upstream and
    # to keep any future non-default `runner` input safe.
    shell: bash
concurrency:
  cancel-in-progress: true
  # Grouped by PR number, not github.ref: pull_request_review is not a
  # pull_request-family event, so github.ref does not resolve the same
  # way for it as it does for a pull_request-only workflow. Review-thread
  # comments live in the deferred idd-advisory-convergence-comment.yml
  # companion workflow (see header) and would not share this group if
  # adopted later. workflow_dispatch/workflow_call have no pull_request
  # context either, so both fall back to their own pr_number input.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
jobs:
  # The job id `idd-advisory-convergence` is the exact check-run context
  # consumed by the rerun helper, advisory-wait policy, required status
  # check, and external-check waiver selector. Adding a `name:` display-name
  # key or changing the job id changes that literal context. This warning is
  # preventive; no observed incident yet. If either edit is intentional,
  # update every consumer to the new literal context together.
  idd-advisory-convergence:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Trusted default-branch checkout, not the PR head, for any
          # trigger type including workflow_dispatch: the assertion
          # logic and its config (.github/idd/config.json) must be the
          # trusted copy, not the PR's own -- otherwise a PR could edit
          # the verdict logic itself to force `ready: true`. The
          # verdict still correctly evaluates the intended PR: `--pr
          # <number>` below drives every live GitHub API call
          # independent of what is checked out locally.
          # <!-- dotfiles-divergence: master-branch -->
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # This repository runs the ephemeral-npx helper profile (no
      # vendored scripts/ directory), so invoke the packaged CLI
      # rather than upstream's `node scripts/advisory-convergence.mjs`
      # form. See docs/idd-policy.md "Helper Runtime Profile".
      - env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # workflow_dispatch's `pr_number` input is `type: number` in the
          # UI, but that constraint is not strictly enforced for direct API
          # dispatches, so route it through env: and reference it as a
          # quoted shell variable rather than interpolating the `${{ }}`
          # expression directly into the run: script.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          npx --yes --package https://codeload.github.com/kurone-kito/idd-skill/tar.gz/f51a8bb73a47452eff5799e8a27251b660ba4ae0 \
            idd-advisory-convergence --pr "$PR_NUMBER" --assert
